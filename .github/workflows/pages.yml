name: Publication sur GitHub Pages

# Cadrage : publie la maquette. Au lot 0, ajouter npm ci, check, tests e2e et build, puis publier dist/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url || steps.publication-2.outputs.page_url || steps.publication-3.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: maquette
      # deploy-pages ne trouve parfois pas l'archive qui vient d'être envoyée : on retente après 20 s, puis 60 s.
      - name: Publier
        id: publication
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Patienter avant un deuxième essai
        if: steps.publication.outcome == 'failure'
        run: sleep 20
      - name: Publier (2e essai)
        id: publication-2
        if: steps.publication.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Patienter avant un troisième essai
        if: steps.publication-2.outcome == 'failure'
        run: sleep 60
      - name: Publier (3e essai)
        id: publication-3
        if: steps.publication-2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
